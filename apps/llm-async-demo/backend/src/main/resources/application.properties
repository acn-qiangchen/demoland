# API key — inject via environment variable, never hardcode
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.max-tokens=2048

server.port=8080

# ---- Redis job store (AWS ElastiCache in the deployed stack) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- DynamoDB job store ----
jobs.table-name=${JOBS_TABLE_NAME:llm-async-demo-jobs}
aws.region=${AWS_REGION:us-east-1}
