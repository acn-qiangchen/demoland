<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM Streaming Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f12;
    --surface: #151820;
    --border: #252a35;
    --accent: #4f8ef7;
    --text: #c9d1e0;
    --text-bright: #eaf0ff;
    --green: #3dd68c;
    --red: #f87171;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }

  .shell {
    width: 100%;
    max-width: 820px;
  }

  header { margin-bottom: 22px; }

  h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-bright);
    margin: 0 0 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text);
    opacity: 0.75;
    margin: 0;
  }

  /* ---- terminal window ---- */
  .terminal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: #10131a;
    border-bottom: 1px solid var(--border);
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .titlebar .label {
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    opacity: 0.6;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 12px;
    opacity: 0.85;
  }

  .status .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text);
    transition: background 0.2s;
  }
  .status.ready      .status-dot { background: var(--text); }
  .status.connecting .status-dot { background: #ffbd2e; }
  .status.streaming  .status-dot { background: var(--accent); }
  .status.done       .status-dot { background: var(--green); }
  .status.error      .status-dot { background: var(--red); }

  /* ---- output ---- */
  .output {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-bright);
    padding: 20px 18px;
    min-height: 220px;
    max-height: 46vh;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .output .placeholder { opacity: 0.4; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- metrics ---- */
  .metrics {
    display: none;
    gap: 26px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: #10131a;
    font-family: var(--mono);
    font-size: 12px;
  }
  .metrics.visible { display: flex; }
  .metric .k { opacity: 0.55; }
  .metric .v { color: var(--accent); font-weight: 500; }

  /* ---- input ---- */
  .input-area {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  .prompt-prefix {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 15px;
    padding-top: 8px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    padding: 8px 0;
    min-height: 24px;
    max-height: 140px;
  }
  textarea::placeholder { color: var(--text); opacity: 0.35; }

  button {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- footer ---- */
  footer {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    opacity: 0.7;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 9px;
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>llm-demo &mdash; token streaming</h1>
      <p class="subtitle">Type a prompt. Tokens stream back from OpenAI in real time over SSE.</p>
    </header>

    <div class="terminal">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="label">/api/chat &mdash; text/event-stream</span>
        <span class="status ready" id="status">
          <span class="status-dot"></span>
          <span id="statusText">ready</span>
        </span>
      </div>

      <div class="output" id="output"><span class="placeholder">Awaiting input&hellip;</span></div>

      <div class="metrics" id="metrics">
        <div class="metric"><span class="k">ttfb</span> <span class="v" id="mTtfb">&ndash;</span></div>
        <div class="metric"><span class="k">total</span> <span class="v" id="mTotal">&ndash;</span></div>
        <div class="metric"><span class="k">tokens</span> <span class="v" id="mTokens">&ndash;</span></div>
      </div>

      <div class="input-area">
        <span class="prompt-prefix">&gt;_</span>
        <textarea id="input" rows="1" placeholder="Ask something&hellip;  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send">send</button>
      </div>
    </div>

    <footer>
      <span class="tag">Spring Boot 3.4</span>
      <span class="tag">Spring AI 1.0</span>
      <span class="tag">WebFlux SSE</span>
      <span class="tag">gpt-4o</span>
      <span class="tag">Vanilla JS</span>
    </footer>
  </div>

<script>
  // Relative URL so this works behind CloudFront (S3 default origin + ALB /api/* origin) with no CORS.
  const API_URL = '/api/chat';

  const output = document.getElementById('output');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const metrics = document.getElementById('metrics');
  const mTtfb = document.getElementById('mTtfb');
  const mTotal = document.getElementById('mTotal');
  const mTokens = document.getElementById('mTokens');

  let streaming = false;

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusText.textContent = text;
  }

  // auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  sendBtn.addEventListener('click', submit);

  function makeCursor() {
    const c = document.createElement('span');
    c.className = 'cursor';
    return c;
  }

  async function submit() {
    if (streaming) return;
    const message = input.value.trim();
    if (!message) return;

    streaming = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    // reset output
    output.textContent = '';
    const cursor = makeCursor();
    output.appendChild(cursor);

    metrics.classList.remove('visible');
    mTtfb.textContent = '–';
    mTotal.textContent = '–';
    mTokens.textContent = '–';

    setStatus('connecting', 'connecting…');

    const started = performance.now();
    let firstTokenAt = null;
    let tokenCount = 0;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      if (!response.ok || !response.body) {
        throw new Error('HTTP ' + response.status);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventType = null;

      setStatus('streaming', 'streaming…');

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // Split into complete lines; keep the trailing partial line buffered.
        let nlIndex;
        while ((nlIndex = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, nlIndex).replace(/\r$/, '');
          buffer = buffer.slice(nlIndex + 1);

          if (line.startsWith('event:')) {
            eventType = line.slice(6).trim();
          } else if (line.startsWith('data:')) {
            const data = line.slice(5).replace(/^ /, '');

            if (eventType === 'token') {
              if (firstTokenAt === null) {
                firstTokenAt = performance.now();
                mTtfb.textContent = Math.round(firstTokenAt - started) + ' ms';
                metrics.classList.add('visible');
              }
              // Token arrives JSON-encoded ({"content":"..."}) so leading spaces and
              // newlines survive the SSE text protocol. Parse it back to the raw text.
              let text;
              try {
                text = JSON.parse(data).content;
              } catch (_) {
                text = data; // fallback if a raw string ever comes through
              }
              tokenCount++;
              cursor.remove();
              output.appendChild(document.createTextNode(text));
              output.appendChild(cursor);
              mTokens.textContent = tokenCount;
              output.scrollTop = output.scrollHeight;
            } else if (eventType === 'done') {
              cursor.remove();
              const total = (performance.now() - started) / 1000;
              mTotal.textContent = total.toFixed(2) + ' s';
              setStatus('done', 'done');
            }

            eventType = null; // reset after each data line
          }
        }
      }

      if (statusEl.classList.contains('streaming')) {
        // stream ended without an explicit done event
        cursor.remove();
        const total = (performance.now() - started) / 1000;
        mTotal.textContent = total.toFixed(2) + ' s';
        setStatus('done', 'done');
      }
    } catch (err) {
      const c = output.querySelector('.cursor');
      if (c) c.remove();
      output.appendChild(document.createTextNode('\n\n[error] ' + err.message));
      setStatus('error', 'error');
    } finally {
      streaming = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.focus();
</script>
</body>
</html>
