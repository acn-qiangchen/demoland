# Batch job, not a web server.
spring.main.web-application-type=none
spring.main.banner-mode=off

# We launch the job manually from S3JobRunner (after downloading the input), so
# disable Spring Boot's run-all-jobs-on-startup behaviour.
spring.batch.job.enabled=false

# Job metadata lives in an in-memory H2 DB created fresh each run; Spring Batch needs
# a JobRepository but this job is stateless across container invocations.
spring.datasource.url=jdbc:h2:mem:batch;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always

# S3 coordinates arrive as env overrides from Step Functions (INPUT_BUCKET etc.);
# relaxed binding maps them onto JobProperties. Left blank => local-file mode.
job.input-bucket=${INPUT_BUCKET:}
job.input-key=${INPUT_KEY:}
job.output-bucket=${OUTPUT_BUCKET:}
job.output-key=${OUTPUT_KEY:}

logging.level.com.demo.osaga=INFO
