name: ec2-demo deploy

# Manual only (workflow_dispatch). Authenticates to AWS via GitHub OIDC — no long-lived
# access keys. The workflow assumes an IAM role (created once via scripts/create-github-oidc-role.sh)
# using a short-lived token, so no AWS secret ever appears in inputs, logs, or metadata.
#
# NOTE: scripts/create-github-oidc-role.sh must be re-run by a human once before the first
# ec2-demo deploy — it adds the ssm:* and instance-profile iam:* permissions this stack needs.
# See the app README.
on:
  workflow_dispatch:
    inputs:
      aws_role_arn:
        description: "ARN of the IAM role to assume via OIDC (created by scripts/create-github-oidc-role.sh). Not sensitive."
        required: true
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"

# id-token: write is required for the runner to request an OIDC token from GitHub.
permissions:
  id-token: write
  contents: read

env:
  APP_NAME: ec2-demo
  TF_DIR: infra/ec2-demo/terraform
  TF_LOCK_TABLE: demoland-tflock

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy inputs
        # Dispatch inputs are authoritative; repo variables (vars.*) act as a fallback if an
        # input is left blank.
        run: |
          set -euo pipefail
          ROLE="${{ inputs.aws_role_arn }}"
          REGION="${{ inputs.aws_region }}"

          echo "AWS_ROLE_ARN=${ROLE:-${{ vars.AWS_ROLE_ARN }}}"   >> "$GITHUB_ENV"
          echo "AWS_REGION=${REGION:-${{ vars.AWS_REGION || 'us-east-1' }}}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ec2-demo-deploy

      - name: Resolve account ID and state bucket
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "TF_STATE_BUCKET=demoland-tfstate-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Bootstrap Terraform state backend (idempotent)
        run: |
          set -euo pipefail
          # S3 state bucket
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "State bucket already exists"
          fi
          # DynamoDB lock table
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Creating lock table $TF_LOCK_TABLE"
            aws dynamodb create-table --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          else
            echo "Lock table already exists"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${APP_NAME}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var "aws_region=$AWS_REGION"
          {
            echo "INSTANCE_ID=$(terraform output -raw instance_id)"
            echo "PUBLIC_IP=$(terraform output -raw public_ip)"
            echo "SSH_COMMAND=$(terraform output -raw ssh_command)"
            echo "SSM_COMMAND=$(terraform output -raw ssm_command)"
          } >> "$GITHUB_ENV"

      - name: Job summary
        run: |
          {
            echo "## ec2-demo deployed :rocket:"
            echo ""
            echo "**Instance ID:** \`$INSTANCE_ID\`"
            echo "**Public IP:** \`$PUBLIC_IP\`"
            echo ""
            echo "### Access"
            echo '```bash'
            echo "# SSH (needs the private key matching the hardcoded public key)"
            echo "$SSH_COMMAND"
            echo ""
            echo "# SSM Session Manager (no key, no inbound port)"
            echo "$SSM_COMMAND"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
