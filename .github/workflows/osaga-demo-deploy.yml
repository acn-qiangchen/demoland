name: osaga-demo deploy

# Manual only (workflow_dispatch). Authenticates to AWS via GitHub OIDC — no long-lived
# access keys. The workflow assumes an IAM role (bootstrapped once via infra/bootstrap/)
# using a short-lived token, so no AWS secret ever appears in inputs, logs, or metadata.
#
# NOTE: infra/bootstrap must be re-applied by a human once before the first osaga-demo
# deploy — it adds the states:* / events:* permissions this stack needs. See the app README.
on:
  workflow_dispatch:
    inputs:
      aws_role_arn:
        description: "ARN of the IAM role to assume via OIDC (output of infra/bootstrap). Not sensitive."
        required: true
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
      image_tag:
        description: "Container image tag to deploy (leave blank to use the commit SHA)"
        required: false
        default: ""

# id-token: write is required for the runner to request an OIDC token from GitHub.
permissions:
  id-token: write
  contents: read

env:
  APP_NAME: osaga-demo
  TF_DIR: infra/osaga-demo/terraform
  APP_DIR: apps/osaga-demo
  TF_LOCK_TABLE: demoland-tflock

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy inputs
        # Dispatch inputs are authoritative; repo variables (vars.*) act as a fallback if an
        # input is left blank. IMAGE_TAG uses the commit SHA by default so each run produces a
        # unique tag Terraform detects as a new task-definition revision.
        run: |
          set -euo pipefail
          ROLE="${{ inputs.aws_role_arn }}"
          REGION="${{ inputs.aws_region }}"
          IMAGE="${{ inputs.image_tag }}"

          echo "AWS_ROLE_ARN=${ROLE:-${{ vars.AWS_ROLE_ARN }}}"   >> "$GITHUB_ENV"
          echo "AWS_REGION=${REGION:-${{ vars.AWS_REGION || 'us-east-1' }}}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE:-${{ github.sha }}}"            >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: osaga-demo-deploy

      - name: Resolve account ID and state bucket
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "TF_STATE_BUCKET=demoland-tfstate-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Bootstrap Terraform state backend (idempotent)
        run: |
          set -euo pipefail
          # S3 state bucket
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "State bucket already exists"
          fi
          # DynamoDB lock table
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Creating lock table $TF_LOCK_TABLE"
            aws dynamodb create-table --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          else
            echo "Lock table already exists"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build batch app
        run: mvn -q -B -f "$APP_DIR/pom.xml" clean package -DskipTests

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${APP_NAME}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"

      - name: Phase 1 — create ECR repository only
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.this \
            -var "aws_region=$AWS_REGION" \
            -var "image_tag=$IMAGE_TAG"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
          docker build -t "$ECR_URL:$IMAGE_TAG" "$APP_DIR"
          docker push "$ECR_URL:$IMAGE_TAG"

      - name: Terraform apply (full stack)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var "aws_region=$AWS_REGION" \
            -var "image_tag=$IMAGE_TAG"
          {
            echo "INPUT_BUCKET=$(terraform output -raw input_bucket_name)"
            echo "OUTPUT_BUCKET=$(terraform output -raw output_bucket_name)"
            echo "STATE_MACHINE_ARN=$(terraform output -raw state_machine_arn)"
          } >> "$GITHUB_ENV"

      - name: Job summary
        run: |
          {
            echo "## osaga-demo deployed :rocket:"
            echo ""
            echo "**Image tag:** \`$IMAGE_TAG\`"
            echo "**Input bucket:** \`$INPUT_BUCKET\`"
            echo "**Output bucket:** \`$OUTPUT_BUCKET\`"
            echo "**State machine:** \`$STATE_MACHINE_ARN\`"
            echo ""
            echo "### Trigger the pipeline"
            echo '```bash'
            echo "aws s3 cp apps/osaga-demo/sample-data/input.csv s3://$INPUT_BUCKET/"
            echo '```'
            echo ""
            echo "Then watch the Step Functions execution, and check the result:"
            echo '```bash'
            echo "aws s3 ls s3://$OUTPUT_BUCKET/processed/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
