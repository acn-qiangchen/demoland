name: llm-demo deploy

# Manual only. Authenticates to AWS via GitHub OIDC — no long-lived access keys.
# The workflow assumes an IAM role (bootstrapped once via infra/bootstrap/) using a
# short-lived token, so no AWS secret ever appears in inputs, logs, or run metadata.
on:
  workflow_dispatch:
    inputs:
      aws_role_arn:
        description: "ARN of the IAM role to assume via OIDC (output of infra/bootstrap). Not sensitive."
        required: true
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
      image_tag:
        description: "Container image tag"
        required: true
        default: "latest"

# id-token: write is required for the runner to request an OIDC token from GitHub.
permissions:
  id-token: write
  contents: read

env:
  APP_NAME: llm-demo
  TF_DIR: infra/app-template/terraform
  BACKEND_DIR: apps/llm-demo/backend
  FRONTEND_FILE: apps/llm-demo/frontend/index.html
  TF_LOCK_TABLE: demoland-tflock

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenAI API key secret is set
        env:
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.SPRING_AI_OPENAI_API_KEY }}
        run: |
          if [ -z "$SPRING_AI_OPENAI_API_KEY" ]; then
            echo "::error::Repo secret SPRING_AI_OPENAI_API_KEY is not set."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: llm-demo-deploy

      - name: Resolve account ID and state bucket
        run: |
          set -euo pipefail
          # After OIDC assume-role, derive the account from STS — no account_id input needed.
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "TF_STATE_BUCKET=demoland-tfstate-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Bootstrap Terraform state backend (idempotent)
        run: |
          set -euo pipefail
          # S3 state bucket
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "State bucket already exists"
          fi
          # DynamoDB lock table
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Creating lock table $TF_LOCK_TABLE"
            aws dynamodb create-table --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          else
            echo "Lock table already exists"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        run: mvn -q -B -f "$BACKEND_DIR/pom.xml" clean package -DskipTests

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${APP_NAME}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"

      - name: Phase 1 — create ECR repository only
        working-directory: ${{ env.TF_DIR }}
        env:
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.SPRING_AI_OPENAI_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.this \
            -var "aws_region=$AWS_REGION" \
            -var "image_tag=${{ inputs.image_tag }}" \
            -var "openai_api_key=$SPRING_AI_OPENAI_API_KEY"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
          docker build -t "$ECR_URL:${{ inputs.image_tag }}" "$BACKEND_DIR"
          docker push "$ECR_URL:${{ inputs.image_tag }}"

      - name: Terraform apply (full stack)
        working-directory: ${{ env.TF_DIR }}
        env:
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.SPRING_AI_OPENAI_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -var "aws_region=$AWS_REGION" \
            -var "image_tag=${{ inputs.image_tag }}" \
            -var "openai_api_key=$SPRING_AI_OPENAI_API_KEY"
          {
            echo "CF_DOMAIN=$(terraform output -raw cloudfront_domain_name)"
            echo "CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)"
            echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)"
          } >> "$GITHUB_ENV"

      - name: Upload frontend and invalidate CloudFront
        run: |
          set -euo pipefail
          aws s3 cp "$FRONTEND_FILE" "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*"

      - name: Job summary
        run: |
          {
            echo "## llm-demo deployed :rocket:"
            echo ""
            echo "**URL:** https://$CF_DOMAIN"
            echo ""
            echo "It can take a few minutes for the ECS task to become healthy and for the"
            echo "CloudFront distribution to finish propagating."
          } >> "$GITHUB_STEP_SUMMARY"
